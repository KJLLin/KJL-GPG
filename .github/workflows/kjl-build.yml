name: KJL-GPG Build (Qt5 / Windows 7)

on:
  workflow_dispatch:
  push:
    branches:
      - release/2.1
      - kjl
    paths-ignore:
      - "**.md"
      - "resource/lfs/locale/**"

permissions:
  contents: read

env:
  # GnuPG bundled into the portable package. 2.4.x is the last series that is
  # known to work on Windows 7.
  GNUPG_VERSION: "2.4.8"
  KJL_VERSION: "2.1.14-kjl.1"

jobs:
  windows-qt5:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: "false"
          submodules: false
          persist-credentials: false

      - name: Init required submodules
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 \
            third_party/gpgme \
            third_party/libassuan \
            third_party/libgpg-error \
            third_party/qttranslations

      - name: Set up MSYS2 / MinGW Qt5
        uses: msys2/setup-msys2@v2
        with:
          update: false
          release: false
          cache: true
          install: >-
            git
            zip
            unzip
            gnupg
            msys2-devel
            base-devel
            msys2-runtime-devel
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-qt5
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-libarchive
            mingw-w64-x86_64-libgpg-error
            mingw-w64-x86_64-libassuan
            mingw-w64-x86_64-argon2
            mingw-w64-x86_64-gtest
            mingw-w64-x86_64-autotools
            mingw-w64-x86_64-angleproject
            mingw-w64-x86_64-texinfo
            mingw-w64-x86_64-ccache

      - name: Install Qt5 Linguist tools (retired from pacman index)
        shell: msys2 {0}
        run: |
          set -euo pipefail
          curl -fL -o /tmp/qt5-tools.pkg.tar.zst \
            https://mirror.msys2.org/mingw/mingw64/mingw-w64-x86_64-qt5-tools-5.15.19-2-any.pkg.tar.zst
          echo "a96e2a38efe9ecba3ef9164b21bfc758c9b7dc0db7de061002f61398e0d00b95  /tmp/qt5-tools.pkg.tar.zst" | sha256sum -c -
          pacman -U --noconfirm /tmp/qt5-tools.pkg.tar.zst

      - name: Build GpgME (static, C++ bindings)
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd "$(cygpath -u "${{ github.workspace }}")/third_party/gpgme"
          export CC="ccache gcc"
          export CXX="ccache g++"
          export CFLAGS="${CFLAGS:-} -Wno-int-conversion -Wno-incompatible-pointer-types"
          ./autogen.sh
          mkdir -p build && cd build
          ../configure \
            --prefix=/mingw64 \
            --enable-static \
            --disable-shared \
            --enable-silent-rules \
            --disable-dependency-tracking \
            --disable-gpgconf-test \
            --disable-gpg-test \
            --disable-gpgsm-test \
            --disable-g13-test
          # Only the C library is used by KJL-GPG. Building the whole tree
          # would also build the Texinfo manual, which the MSYS2 makeinfo
          # cannot parse; build and install src/ alone.
          make -C src -j4
          make -C src install

      - name: Configure and build KJL-GPG
        shell: msys2 {0}
        env:
          CCACHE_COMPILERTYPE: gcc
        run: |
          set -euo pipefail
          cd "$(cygpath -u "${{ github.workspace }}")"
          mkdir -p build && cd build
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGPGFRONTEND_QT5_BUILD=ON \
            -DGPGFRONTEND_LINK_GPGME_INTO_CORE=ON \
            -DGPGFRONTEND_VERSION_OVERRIDE="${KJL_VERSION}" \
            ..
          cmake --build . -- -j 4

      - name: Fetch GnuPG for Windows 7
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd "$(cygpath -u "${{ github.workspace }}")"
          scripts/ci/windows/fetch_gnupg.sh

      - name: Package portable ZIP
        shell: msys2 {0}
        run: |
          set -euo pipefail
          ROOT="$(cygpath -u "${{ github.workspace }}")"
          cd "$ROOT"
          NAME="KJL-GPG-${KJL_VERSION}-windows-x86_64-portable.zip"
          mkdir -p build/upload-artifact
          cd build/artifacts
          cp "$ROOT/README.md" "$ROOT/COPYING" "$ROOT/PrivacyPolicy.md" "$ROOT/SECURITY.md" .
          echo "PortableMode=true" > bin/ENV.ini
          # Import libraries are build-time only; keep the portable payload lean.
          rm -f bin/*.a
          # CMake only copies direct dependencies. Pull in the remaining
          # MinGW runtime libraries (glib/gobject, zlib-ng, ...) so the
          # package also runs on a clean Windows box.
          for pass in 1 2; do
            for f in bin/*.dll bin/KJL-GPG.exe; do
              ldd "$f" 2>/dev/null || true
            done | awk '{for (i = 1; i <= NF; i++) if ($i ~ /^\/mingw64\/bin\//) print $i}' \
              | sort -u | while read -r dll; do
                [ -f "bin/$(basename "$dll")" ] || cp "$dll" bin/
              done
          done
          # Only deploy against the executable. Qt DLLs are already copied
          # next to it by CMake; pointing windeployqt at non-Qt DLLs makes it
          # exit non-zero ("does not seem to be a Qt executable").
          windeployqt-qt5 --no-translations --force bin/KJL-GPG.exe
          zip -r "$ROOT/build/upload-artifact/$NAME" .
          ls -lh "$ROOT/build/upload-artifact"

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: KJL-GPG-windows-x86_64-portable
          path: ${{ github.workspace }}/build/upload-artifact/*
          if-no-files-found: error

  # End-to-end regression on the exact ZIP users download: unpack it, point
  # GnuPG/GPGME at the bundled binaries, then run the built-in gtest suite.
  regression-test:
    needs: windows-qt5
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout (regression baseline)
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/kjl-test-baseline.txt

      - name: Download portable package
        uses: actions/download-artifact@v4
        with:
          name: KJL-GPG-windows-x86_64-portable
          path: pkg

      - name: Run built-in unit tests from the package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Get-ChildItem pkg -Filter *.zip | Select-Object -First 1
          if (-not $zip) { throw "portable ZIP not found" }
          Expand-Archive $zip.FullName -DestinationPath pkg/expanded -Force
          $root = (Resolve-Path pkg/expanded).Path
          $bin = Join-Path $root "bin"
          $gnupg = Join-Path $root "gnupg\bin"
          $env:PATH = "$gnupg;$bin;$env:PATH"
          $env:GNUPGHOME = Join-Path $root "gnupg-home"
          New-Item -ItemType Directory -Force $env:GNUPGHOME | Out-Null
          $xml = Join-Path $root "test-results.xml"
          $env:GTEST_OUTPUT = "xml:$xml"
          Set-Content -Path (Join-Path $bin "ENV.ini") -Value "PortableMode=true"
          Write-Host "binary: $bin\KJL-GPG.exe"
          $p = Start-Process -FilePath (Join-Path $bin "KJL-GPG.exe") `
                -ArgumentList "--test" -WorkingDirectory $bin -NoNewWindow -Wait -PassThru
          Write-Host "exit code: $($p.ExitCode)"
          if (-not (Test-Path $xml)) {
            throw "gtest XML not produced; the suite did not run to completion"
          }
          [xml]$doc = Get-Content $xml
          $s = $doc.testsuites
          $tests = [int]$s.tests
          $failures = [int]$s.failures
          $errors = [int]$s.errors
          $disabled = [int]$s.disabled
          Write-Host "gtest: tests=$tests failures=$failures errors=$errors disabled=$disabled"
          Get-ChildItem $root -Filter "test-results.xml" | Copy-Item -Destination $env:GITHUB_WORKSPACE -Force

          $failed = @()
          foreach ($suite in $doc.testsuites.testsuite) {
            foreach ($case in $suite.testcase) {
              if ($case.failure -or $case.error) {
                $failed += "$($case.classname).$($case.name)"
              }
            }
          }
          $baseline = Get-Content (Join-Path $env:GITHUB_WORKSPACE ".github/kjl-test-baseline.txt") |
                      Where-Object { $_ -and -not $_.StartsWith("#") }
          $newFailures = @($failed | Where-Object { $baseline -notcontains $_ })
          Write-Host "failed: $($failed.Count), known: $($failed.Count - $newFailures.Count), new: $($newFailures.Count)"
          foreach ($n in $newFailures) { Write-Host "::error::new regression failure: $n" }
          if ($newFailures.Count -gt 0) { exit 1 }
          if ($tests -eq 0) { Write-Host "::error::no tests were executed"; exit 1 }
          Write-Host "regression gate passed: $($tests - $failures)/$tests passed, $($failed.Count) known upstream failures"

      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KJL-GPG-regression-report
          path: ${{ github.workspace }}/test-results.xml
          if-no-files-found: warn

  # Visual regression evidence: launch the packaged app on a clean runner and
  # capture the window, so UI breakage is visible in the run itself.
  ui-screenshot:
    needs: windows-qt5
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Download portable package
        uses: actions/download-artifact@v4
        with:
          name: KJL-GPG-windows-x86_64-portable
          path: pkg

      - name: Launch KJL-GPG and capture screenshot
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Get-ChildItem pkg -Filter *.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath pkg/expanded -Force
          $root = (Resolve-Path pkg/expanded).Path
          $bin = Join-Path $root "bin"
          $env:PATH = "$(Join-Path $root 'gnupg\bin');$bin;$env:PATH"
          $env:GNUPGHOME = Join-Path $root "gnupg-home"
          New-Item -ItemType Directory -Force $env:GNUPGHOME | Out-Null
          Set-Content -Path (Join-Path $bin "ENV.ini") -Value "PortableMode=true"
          # Force Simplified Chinese for the UI screenshot, independent of the
          # runner's en-US system locale.
          $cfg = Join-Path $root "config"
          New-Item -ItemType Directory -Force $cfg | Out-Null
          Set-Content -Path (Join-Path $cfg "config.ini") -Value "[basic]`nlang=zh_CN"
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public class KJLShot {
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int L,T,R,B; }
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
            [DllImport("user32.dll")] public static extern bool PrintWindow(IntPtr h, IntPtr dc, uint flags);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
          }
          "@

          function Capture-Theme([string]$theme) {
            # QSettings maps appearance/ui_theme to [appearance] ui_theme.
            Set-Content -Path (Join-Path $cfg "config.ini") `
              -Value "[basic]`nlang=zh_CN`n`n[appearance]`nui_theme=$theme`n`n[wizard]`nshow_wizard=false"
            $proc = Start-Process -FilePath (Join-Path $bin "KJL-GPG.exe") `
                     -WorkingDirectory $bin -PassThru
            $h = [IntPtr]::Zero
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              $proc.Refresh()
              $h = $proc.MainWindowHandle
              if ($h -ne 0) { break }
            }
            if ($h -eq 0) { throw "KJL-GPG did not open a window ($theme)" }
            Start-Sleep -Seconds 3
            [KJLShot]::SetForegroundWindow($h) | Out-Null
            Start-Sleep -Seconds 2
            # Fixed 1024x768 hosted desktop; the window sits at 0,0.
            $w = 1000; $ht = 700
            $bmp = New-Object System.Drawing.Bitmap $w, $ht
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $size = New-Object System.Drawing.Size($w, $ht)
            $g.CopyFromScreen(0, 0, 0, 0, $size)
            $g.Dispose()
            $out = Join-Path $env:GITHUB_WORKSPACE "ui-screenshot-$theme.png"
            $bmp.Save($out, [System.Drawing.Imaging.ImageFormat]::Png)
            $bmp.Dispose()
            if (-not (Test-Path $out) -or (Get-Item $out).Length -lt 20000) {
              throw "screenshot looks empty ($theme)"
            }
            Write-Host "screenshot: $out ($((Get-Item $out).Length) bytes)"
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 2
          }

          Capture-Theme "light"
          Capture-Theme "dark"

      - name: Upload UI screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KJL-GPG-ui-screenshot
          path: |
            ${{ github.workspace }}/ui-screenshot-light.png
            ${{ github.workspace }}/ui-screenshot-dark.png
          if-no-files-found: warn
